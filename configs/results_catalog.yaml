  - summary: data/processed/figures/figure_compound_collection/summary.json
    section: figures
    title: Compound collection and its chemical characterization
    highlights:
      - { key: dataset_structure.full_collection_compounds, label: Compounds in the full collection }
      - { key: population.analyzed_compounds, label: Compounds analyzed }
      - { key: target_moa_annotations.target_or_moa_any.count, label: With a target or MOA annotation }
  - summary: data/processed/figures/figure_phenotypic_consistency/summary.json
    section: figures
    title: Phenotypic activity and consistency across the collection
    highlights:
      - { key: well_level_profiles, label: Well-level profiles }
      - { key: perturbation_level_profiles, label: Compound-level profiles }
      - { key: active_perturbations, label: Phenotypically active compounds }
  - summary: data/processed/figures/figure_compound_activity_associations/summary.json
    section: figures
    title: Compound properties associated with activity and consistency
    highlights:
      - { key: analyzed_compounds, label: Compounds analyzed }
      - { key: phenotypically_active_compounds, label: Phenotypically active compounds }
  - summary: data/processed/figures/figure_opentargets_group_consistency/summary.json
    section: figures
    title: Phenotypic consistency of OpenTargets target groups
  - summary: data/processed/figures/figure_suppl_structure/summary.json
    section: figures
    title: Structure and morphology among active compounds
    highlights:
      - { key: phenotypically_active_compounds, label: Phenotypically active compounds }
      - { key: active_compounds_analyzed, label: Active compounds analyzed }
  - summary: data/processed/figures/figure_suppl_chemical_properties/summary.json
    section: figures
    title: Chemical properties of the analyzed compounds
  - summary: data/processed/figures/figure_positive_control_reproducibility/summary.json
    section: figures
    title: Positive-control reproducibility across sources
    optional: true
    highlights:
      - { key: compounds, label: Positive controls }
      - { key: sources, label: Sources }
      - { key: matched_compound_source_pairs, label: Compound-source pairs }

