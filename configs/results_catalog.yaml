  # ------------------------------------------------------------------ Activity and consistency
  - summary: data/processed/activity-summary/summary.json
    section: activity
    title: Phenotypic activity headline
    highlights:
      - { key: analyzed_compounds, label: Compounds analyzed }
      - { key: phenotypically_active_compounds, label: Phenotypically active compounds }
      - { key: active_rate_percent, label: Active rate }
  - path: data/processed/copairs_results.duckdb
    section: activity
    title: Activity and consistency results database
    description: >-
      One DuckDB database aggregating every copairs run: per-compound activity results and scores,
      and per-group consistency results and scores. Each row carries the configuration that
      produced it in columns prefixed with an underscore, so filter on dataset, preprocessing,
      filter and activity parameters to select one run.
  - path: data/processed/copairs/runs/
    requires: data/processed/copairs/runs/.complete
    section: activity
    title: Per-run activity and consistency outputs
    description: >-
      One folder per copairs run, named by dataset, feature columns, preprocessing, filter and
      parameters. Each holds the mean average precision results, the per-profile average precision
      scores, a diagnostic plot, the run log and the exact configuration used.
  - path: data/processed/target-consistency/
    requires: data/processed/target-consistency/.complete
    section: activity
    title: Consistency of target and annotation groups
    description: >-
      For each profile set, annotation source and distance metric: the group consistency results
      table, a volcano plot, a dot plot and UMAP grids of the groups.
  - path: data/processed/dataset_reference/
    requires: data/processed/dataset_reference/dataset_reference.csv
    section: activity
    title: Reported numbers in one table
    description: >-
      Every number from the paper-report summaries collated into one table. Each row names its
      claim key, value, source summary and producing rule. Nothing here is recomputed.
    files:
      - dataset_reference.csv
      - dataset_reference.json
  - summary: data/processed/exploration/0.01/compound_no_source7/summary.json
    section: activity
    title: Cosine versus absolute-cosine distance for consistency
  - summary: data/processed/exploration/0.05/compound_no_source7/summary.json
    section: activity
    title: Sensitivity of consistency to the activity threshold
  - summary: data/processed/exploration/0.06/compound_no_source7/summary.json
    section: activity
    title: Relationship between activity and consistency
  - summary: data/processed/exploration/0.07/compound_no_source7/summary.json
    section: activity
    title: Statistical power of the activity test

