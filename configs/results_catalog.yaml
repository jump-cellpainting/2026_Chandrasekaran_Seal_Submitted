# Authored registry for the results catalog (data/processed/catalog.json).
#
# This file is the membership definition and the only place where a title or section is written.
# `rule results_catalog` builds every file named here, then joins these entries with the summary
# envelopes. Descriptions and numbers come from the envelopes, never from this file.
#
# An entry is one of:
#   summary:  a `{description, numbers, files}` envelope written by an analysis.
#             Optional `highlights` name keys in that envelope's `numbers` (dotted for nesting) and
#             give each a reader-facing label. The value is read from the envelope at build time.
#             `optional: true` marks an opt-in target outside the default run: it is cataloged
#             when its summary exists, and the catalog never causes it to be built.
#   path:     results without an envelope, described here. A path ending in `/` is a directory and
#             names in `requires` the file that proves it was built; otherwise it is one file.
#
# Entries appear in the browser in this order within their section. Titles describe what a result
# is; they do not cite manuscript figure numbers, which change between versions.

schema_version: 1
repository: https://github.com/jump-cellpainting/2026_Chandrasekaran_Seal_Submitted

sections:
  - id: figures
    title: Paper figures
    description: >-
      Figure packages: the rendered panels, their legends and the tables each panel is drawn from.
  - id: collection
    title: Compound collection
    description: >-
      What was screened: the structure of the dataset and the chemistry, annotations and external
      identifiers of its compounds.
  - id: activity
    title: Phenotypic activity and consistency
    description: >-
      Which compounds produce a detectable phenotype, which annotation groups share one, and the
      scores behind both.
  - id: maps
    title: Morphology maps
    description: >-
      UMAP views of the profiles for each feature set and compound subset. Profiles exclude
      Source 7 unless a title says otherwise.
  - id: reproducibility
    title: Reproducibility, batch effects and data quality
    description: >-
      How results hold across sites, feature sets and batch-correction choices, with checks on cell
      count and plate position.
  - id: structure
    title: Chemical structure and phenotype
    description: >-
      How chemical structure and compound properties relate to morphology and phenotypic activity.
  - id: applications
    title: Annotation-driven analyses
    description: >-
      Analyses built on external annotations: targets, functional use, toxicity, kinase probes and
      commercial availability.

entries:
